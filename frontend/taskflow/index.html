<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Team Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236c63ff'/><text y='24' x='4' font-size='22'>⚡</text></svg>">
</head>
<body>
  <div class="toast-container" id="toast-container"></div>
  <div id="app-root" style="min-height:100vh;display:grid;place-items:center">
    <div style="text-align:center;color:var(--text2)">
      <div class="loader" style="width:40px;height:40px;margin:0 auto 16px"></div>
      <div style="font-family:var(--font-mono);font-size:13px">Loading TaskFlow...</div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/admin.js"></script>

  <script>
    // ── BOOT ──────────────────────────────────────────────────
    (async function init() {
      const user = getUser();
      const token = getToken();

      if (!token || !user) {
        renderAuthLayout();
        navigate('login');
        return;
      }

      // Validate token
      try {
        const me = await api.me();
        setUser(me.user || me);
        renderLayout();
        navigate('dashboard');
      } catch {
        removeToken();
        removeUser();
        renderAuthLayout();
        navigate('login');
      }
    })();
  </script>
</body>
</html>
